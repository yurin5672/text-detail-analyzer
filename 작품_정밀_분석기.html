<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작품 정밀 분석기</title>
<style>

</style></head><body>
<header><h1>작품 정밀 분석기</h1><p>장르·분위기를 먼저 판별해 평가 기준을 맞춘 뒤, 15개 영역 170개 지표로 채점하고 등급과 개선안을 뽑아냄.</p></header>
<main>
<section>
 <div class="panel"><h2>내 서재 <small class="hint">이 기기(브라우저)에 저장</small></h2><div id="lib"></div></div>
 <div class="panel"><h2>API 설정</h2>
  <label>제공자</label><select id="provider"><option value="gemini">Google Gemini</option><option value="openai">OpenAI 호환</option></select>
  <div id="epw" style="display:none"><label>API 주소</label><input id="endpoint" value="https://api.openai.com/v1/chat/completions"></div>
  <div class="row"><div><label>모델명</label><input id="model" value="gemini-flash-latest"></div><div><label>API 키</label><input id="apiKey" type="password" placeholder="AIza... / sk-..."></div></div>
  <p class="hint">키는 이 브라우저에서만 쓰여. 한 번 분석에 요청이 12번 이상 나가니 무료 키는 한도에 주의.</p></div>
 <div class="panel"><h2>작품 투입</h2>
  <label>회차 이름</label><input id="title" placeholder="예: 3화">
  <label>본문</label><textarea id="story" placeholder="분석할 글을 붙여 넣어. 1화 분량(3천~1만자)이 가장 정확해."></textarea>
  <div class="actions" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button id="go">정밀 분석 시작</button><button class="s" id="cp">보고서 복사</button><button class="s" id="dl">서재 백업(JSON)</button><button class="s" id="imp">백업 불러오기</button></div>
  <div id="status"></div><div class="bar"><i id="pg"></i></div></div>
</section>
<section id="out"><div class="panel hint">왼쪽에 글을 넣고 분석을 시작하면 결과가 여기에 쌓여.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);

const CATS=[

["서사·구성","플롯 인과,구조 균형,갈등 설계,목표·동기 명확성,위기-해소 리듬,복선·회수,반전 효과,장면 전환,정보 공개 타이밍,엔딩 여운"],
["인물","주인공 매력,입체성,동기 설득력,행동 일관성,성장·변화,조연 활용,악역·적대자,관계 케미,캐릭터 구별,이름·호칭 관리"],

["장르·클리셰","장르 문법 충실,클리셰 활용,클리셰 변주,독창성,트렌드 적합,신선함,타깃 일치,장르 혼합 균형,기대 충족,차별 포인트"],

["상업성","연재 적합성,플랫폼 적합,제목·로그라인 매력,정주행성,팬덤 형성력,2차 확장성,댓글 유발,결제 전환력,완결 가능성,리텐션"]
];
const EX=["가독 유지력,초반 이탈 구간 없음","서사 밀도,회차 단위 완결감","주인공 결핍·욕망,인물 등장 타이밍","대사 리얼리티,대화의 갈등 기능","문장 정확성,장면별 문체 적응","표기 일관성,연재 가독 규격 준수","세계 규칙 활용,정보 제시 자연스러움","장르 약속 이행,독자 기대 배신","감정선 설계,주제 반복 변주","독자층 도달성,수익 모델 적합"];
EX.forEach((e,i)=>CATS[i][1]+=','+e);
CATS.push(["시점·서술","시점 안정성,서술 거리 조절,내적 독백 비중,정보 제한 활용,화자 신뢰도,시제 일관,서술 속도 조절,보여주기 vs 말하기,시간 구조,서술 목소리"],
["독자 경험·심리","감정이입 속도,대리만족,카타르시스 타이밍,기대-배신 균형,인지 부하 관리,몰입 방해 요소 없음,공감 가능한 결핍,호기심 간격 설계,정서 보상,재독 가치"],
["장면·연출","장면 목적 명확성,장면 길이 균형,공간 묘사,시간 흐름 처리,사건·액션 연출,심리 묘사,분위기 조성,장면 전환 연결,시각적 이미지,긴장-이완 배치"],
["톤·완성도","톤 일관성,유머·진지 균형,표현 수위 적정,편견 표현 회피,모방·답습 위험 없음,퇴고 완성도,분량 적정,제목-본문 일치,마무리 처리,전반 완성도"],
["회차 연계","설정 일관성,복선 회수,인물 행동 일관성,인물 변화 누적,전개 속도 균형,떡밥 추가·회수 균형,회차 엔딩-시작 연결,반복 패턴 피로도,클리프행어 연쇄,시리즈 흡인력"]);
const RUB="채점 기준: 0~100점. 0~29 심각한 결함, 30~49 미흡, 50~59 연재 플랫폼 평균(50=평균), 60~69 양호, 70~79 상위권, 80~89 매우 우수, 90 이상은 극소수. 점수 인플레이션 금지. 지표를 비슷한 점수로 뭉치지 말고 근거에 따라 차이를 둘 것. 본문에서 확인할 수 없는 지표는 s를 null로 하고 c에 이유를 쓸 것. 제공된 본문 범위 안에서만 평가.";
let S={},busy=false;
const parse=s=>{s=s.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw Error('JSON 응답을 찾지 못했어.');return JSON.parse(s.slice(a,b+1).replace(/,\s*([}\]])/g,'$1'))};
async function callJ(p,t){let e;for(let i=0;i<3;i++){try{return parse(await callAI(p,t))}catch(x){e=x;if(!(x instanceof SyntaxError||/JSON/.test(x.message)))throw x;$('status').textContent=`응답 형식 오류, 재요청 (${i+1}/3)…`}}throw e}
const prog=(m,p)=>{$('status').textContent=m;$('pg').style.width=p+'%'};
async function callAI(prompt,temp=0.4){
 const key=$('apiKey').value.trim();let model=$('model').value.trim();
 if(!key||!model)throw Error('API 설정을 먼저 입력해줘.');
 const SYS='Return only valid JSON. Follow the instructions exactly. Write all text values in Korean. Never use double quotes inside string values (use single quotes or 「」 instead), no trailing commas, no line breaks inside strings.';
 const gem=$('provider').value==='gemini';
 const url=gem?`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model.replace(/^models\//,''))}:generateContent`:$('endpoint').value.trim();
 const init=gem?{headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:temp,responseMimeType:'application/json'}})}
 :{headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,temperature:temp,messages:[{role:'system',content:SYS},{role:'user',content:prompt}]})};
 const D=[3000,7000,15000,30000];let r,d;
 for(let i=0;;i++){
  r=await fetch(url,{method:'POST',...init});d=await r.json().catch(()=>({}));
  if(r.ok||![429,500,503,504].includes(r.status)||i>=D.length)break;
  $('status').textContent=`서버 혼잡, ${D[i]/1000}초 뒤 재시도 (${i+1}/${D.length})…`;await new Promise(f=>setTimeout(f,D[i]));
 }
 if(!r.ok)throw Error(d.error?.message||`API 오류 (${r.status})`);
 if(gem){const c=d.candidates?.[0];if(d.promptFeedback?.blockReason)throw Error('요청 차단: '+d.promptFeedback.blockReason);const t=(c?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');if(!t)throw Error('빈 응답'+(c?.finishReason?` (${c.finishReason})`:''));return t}
 return d.choices?.[0]?.message?.content||'';
}
function stats(t){
 const ch=t.replace(/\s/g,'').length,P=t.split(/\n+/).filter(x=>x.trim()),
 sn=t.split(/(?<=[.!?…。])["”'’]?\s+|\n+/).filter(x=>x.trim().length>1),L=sn.map(x=>x.length),
 av=L.reduce((a,b)=>a+b,0)/(L.length||1),q=(t.match(/[“"][^”"\n]{1,300}[”"]/g)||[]).join('').length,
 W=t.match(/[가-힣]{2,}/g)||[],F={};W.forEach(w=>F[w]=(F[w]||0)+1);
 const top=Object.entries(F).filter(([w,c])=>w.length>=3&&c>=4).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const k=n=>(n/ch*1000).toFixed(1);
 return{공백제외글자수:ch,문단수:P.length,문장수:sn.length,평균문장길이:av.toFixed(0)+'자',긴문장비율:(L.filter(x=>x>80).length/(L.length||1)*100).toFixed(0)+'%',평균문단길이:(ch/(P.length||1)).toFixed(0)+'자',대사비율:(q/t.length*100).toFixed(0)+'%',어휘다양성:(new Set(W).size/(W.length||1)).toFixed(2),'느낌표/천자':k((t.match(/!/g)||[]).length),'말줄임/천자':k((t.match(/…|\.{3}/g)||[]).length),예상읽기시간:Math.max(1,Math.round(ch/550))+'분',반복어:top.map(([w,c])=>w+'×'+c).join(', ')||'없음'};
}
const sline=()=>Object.entries(S.stats).map(([k,v])=>k+'='+v).join(', ');
const head=()=>`작품 제목: ${S.title||'미상'}\n[참고용 기계 계산 통계] ${sline()}\n${S.prev?`[같은 작품의 이전 회차 요약: 연속성·복선·설정 일관성 평가 때 참고. 평가 대상은 아래 본문이다]\n${S.prev}\n`:''}\n[작품 본문]\n${S.text}`;
const profPrompt=()=>`너는 대중문학·웹소설 전문 편집자이자 서사학자다. 아래 글의 정체를 판별하고, 이 글에 맞는 평가 기준을 설계해라.
- weights: ${CATS.length}개 영역(${CATS.map(c=>c[0]).join(', ')}) 순서의 가중치(0.3~2.0). 장르·분량·분위기에 따라 중요도를 다르게 줘라(예: 코미디는 대사·감정↑, 미스터리는 서사·복선↑, 프롤로그는 훅↑).
- devices: 글에서 실제로 발견되는 서사 기법·수사 용어(예: 인 메디아스 레스, 체호프의 총, 신뢰할 수 없는 화자, 3막 구조, 클리셰 전복 등) 3~8개와 본문 근거.
JSON: {"genre":"주장르","sub":["세부장르"],"tags":["키워드"],"mood":["분위기"],"pov":"시점","stage":"분량·회차 성격","target":"예상 타깃 독자층","platform":"어울리는 연재 방식","logline":"한 줄 요약","weights":[${CATS.length}개 숫자],"criteria":"이 작품에 적용할 평가 기준: 중요하게 볼 것/관대하게 볼 것 3~4문장","devices":[{"term":"용어","where":"본문 근거","note":"효과"}],"digest":"이 회차 줄거리 4~6문장 + 핵심 인물·설정·미해결 떡밥(다음 회차 평가용 요약, 500자 이내, 줄바꿈 금지)"}
\n${head()}`;

 const pts=ok.map((x,i)=>[20+(ok.length>1?i*300/(ok.length-1):150),110-x.t.score]);
 return`<div class="panel"><h2>${esc(w.title)} <small class="hint">${w.eps.length}회차 · 분석 완료 ${ok.length}회차</small></h2>${ok.length>1?`<svg viewBox="0 0 340 125"><polyline points="${pts.join(' ')}" fill="none" stroke="#b6a0ff" stroke-width="2"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${col(ok[i].t.score)}"/><text x="${q[0]}" y="${q[1]-8}" font-size="10" text-anchor="middle" fill="#ececf2">${ok[i].t.score.toFixed(0)}</text>`).join('')}</svg>`:'<p class="hint">2개 회차 이상 분석하면 점수 추이 그래프가 나와.</p>'}</div>
<div class="panel"><h2>회차 × 영역 점수표 <small class="hint">회차명을 누르면 해당 회차 결과로 이동</small></h2><div style="overflow-x:auto"><table class="hm"><tr><th></th>${E.map(x=>`<th onclick="pickE('${x.e.id}');go('sum')">${esc(x.e.name)}</th>`).join('')}</tr><tr><td>종합</td>${E.map(x=>`<td style="font-weight:700">${x.t.score==null?'-':grade(x.t.score)+' '+x.t.score.toFixed(0)}</td>`).join('')}</tr>${CATS.map((c,i)=>`<tr><td>${c[0]}</td>${E.map(x=>{const a=x.t.av[i];return`<td style="${a==null?'color:var(--m)':`background:${col(a)};color:#101116`}">${a==null?'-':a.toFixed(0)}</td>`}).join('')}</tr>`).join('')}</table></div></div>
<div class="panel"><h2>작품 전체 종합</h2><p class="hint">회차별 요약·점수를 모아 연속성, 성장 추세, 반복되는 약점을 분석해. 분석한 회차가 많을수록 정확해.</p><button onclick="workSyn()">${y?'다시 ':''}종합 분석 실행</button>${y?`<div class="box">${esc(y.overall)}</div><h3>점수 추이·성장</h3><p>${esc(y.trend)}</p><h3>회차 간 연속성·일관성</h3><p>${esc(y.continuity)}</p><h3>반복되는 약점</h3>${ul(y.recurring||[])}<h3>다음 회차 제안</h3>${ul(y.next||[])}`:''}</div>`}
$('title').oninput=()=>{S.name=$('title').value;S.title=cw().title+' '+S.name;renderLib();persist()};
$('story').oninput=()=>{S.text=$('story').value;persist()};
$('imp').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());if(!d.works?.length)throw 0;LIB=d;pick()}catch{alert('올바른 백업 파일이 아니야.')}};f.click()};
(async()=>{const d=await load();if(d?.works?.length)LIB=d;else{const w=newW('내 작품');LIB={works:[w],w:w.id,e:w.eps[0].id}}pick()})();
</script></body></html>
